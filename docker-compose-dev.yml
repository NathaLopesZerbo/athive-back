networks:
  athive:
    name: athive
    driver: bridge

volumes:
  mysql_data:

services:
  nginx:
    image: nathazerbo/nginx-stable-alpine:latest
    container_name: athive_nginx
    hostname: athive_nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/log:/var/log/nginx
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - athive

  php:
    image: nathazerbo/php-fpm-8.4:latest
    container_name: athive_php
    hostname: athive_php
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
    networks:
      - athive

  db:
    image: mysql:8.0
    container_name: athive_mysql
    hostname: athive_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3301:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - athive
